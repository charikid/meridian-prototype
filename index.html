<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Meridian: real-time operational intelligence and digital twins for asset-intensive operators, integrated with SAP.">
<title>Meridian Command Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one-screen command centre. Header + KPI strip, then event feed | live map | loop panel. Stacks on narrow screens. */
:root{
  color-scheme: dark;
  --bg:#070B10; --surface:#0C131B; --raise:#111A24; --line:#1A2633; --line-2:#24344A;
  --fg:#E6EDF3; --fg-2:#A9B7C6; --fg-3:#8293A5;
  --accent:#5EEAD4; --accent-ink:#04201C; --accent-dim:#1F6F66;
  --crit:#FF6B6B; --high:#F5A524; --med:#7DB8FF; --ok:#5EEAD4;
  --route:#2A8F83; --cat9:#A78BFA; --route-dim:#1B4B47; --land:#0E1620; --sea:#0A1A26; --grid:#111C28;
  --f-display:'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.seg{display:flex;padding:3px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:0 14px;min-height:38px;border-radius:7px;cursor:pointer;color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.ctl{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--fg-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.btn[aria-pressed="true"] .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(94,234,212,.15)}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kpi{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v.warn{color:var(--high)}
.kpi .s{font-size:12px;color:var(--fg-3)}

/* Main grid */
.main{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:12px;min-height:0}
.pane{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pane-b{overflow:auto;min-height:0;flex:1}

/* Feed */
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;min-height:34px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--fg-3);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raise)}
.count{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);margin-left:4px}
.list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:4px}
.item{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:10px 10px 10px 14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;position:relative}
.item::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--sevc,var(--fg-3))}
.item:hover{background:var(--raise)}
.item[aria-current="true"]{background:var(--raise);border-color:var(--line-2)}
.item .t{font-weight:500;color:var(--fg);grid-column:1}
.item .m{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);grid-column:1}
.item .c{grid-column:2;grid-row:1;font-family:var(--f-mono);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .t{color:var(--fg-2)}
.item.new{animation:slidein .5s ease-out}
@keyframes slidein{from{transform:translateY(-6px);background:rgba(94,234,212,.08)}to{transform:none}}
.empty{padding:24px 16px;color:var(--fg-3);font-size:13px}

/* Map */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--land);overflow:hidden;min-height:0}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.hud{position:absolute;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-tl{left:12px;top:12px;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:8px;background:rgba(7,11,16,.82);border:1px solid var(--line)}
.hud-tl b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.hud-tl span{font-size:11px;color:var(--fg-3)}
.hud-bl{left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(7,11,16,.82);border:1px solid var(--line);font-size:11px;color:var(--fg-2)}
.hud-bl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.hud-br{right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zb{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:rgba(7,11,16,.88);cursor:pointer;display:grid;place-items:center}
.zb:hover{border-color:var(--fg-3)}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);opacity:0;transition:opacity .25s, transform .25s;padding:8px 14px;border-radius:999px;background:var(--raise);border:1px solid var(--line-2);font-size:12px;display:flex;gap:8px;align-items:center;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#map{transition:opacity .2s ease}
.back{align-self:flex-start;border:0;background:none;padding:0;min-height:28px;color:var(--accent);font-family:var(--f-mono);font-size:12px;cursor:pointer}
.back:hover{color:#99F6E4}
.ov-land{fill:#142230;stroke:#2E4A62;stroke-width:1.2;vector-effect:non-scaling-stroke}
.ov-nb{fill:#0D1620;stroke:#1A2A38;stroke-width:1;vector-effect:non-scaling-stroke}
.ov-sea-label{font-family:var(--f-mono);font-size:10px;fill:#3E5469;letter-spacing:.14em;text-transform:uppercase}
.ov-region{font-family:var(--f-mono);font-size:10px;fill:#6A7F94;letter-spacing:.12em;text-transform:uppercase}
.hs-t{font-family:var(--f-display);font-size:14px;font-weight:500;fill:var(--fg)}
.hs-s{font-family:var(--f-mono);font-size:11px;fill:var(--fg-2)}
.hs-bg{fill:rgba(7,11,16,.78);stroke:var(--line-2);stroke-width:1}
.mk:hover .hs-bg{stroke:var(--accent)}
.dcards{display:flex;flex-direction:column;gap:10px}
.dcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;width:100%;padding:14px;border-radius:10px;border:1px solid var(--line-2);background:var(--raise);cursor:pointer}
.dcard:hover{border-color:var(--accent-dim)}
.dcard b{font-family:var(--f-display);font-weight:500;font-size:16px}
.dcard .pl{color:var(--fg-3);font-size:12px;grid-column:1}
.dcard .nums{grid-column:1 / -1;display:flex;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.dcard .go-t{grid-column:2;grid-row:1;color:var(--accent);font-family:var(--f-mono);font-size:12px;align-self:center}

/* SVG map styling */
.bg-road{stroke:#1A2838;stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.bg-river{stroke:#163247;stroke-width:3;fill:none;vector-effect:non-scaling-stroke}
.bg-sea{fill:var(--sea)}
.bg-coast{stroke:#1B3A50;stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.bg-bound{stroke:#2A3A4C;stroke-width:1.5;stroke-dasharray:6 5;fill:none;vector-effect:non-scaling-stroke}
.bg-label{font-family:var(--f-mono);font-size:10px;fill:#4A5D72;letter-spacing:.1em;text-transform:uppercase}
.a-line{stroke:var(--route);stroke-width:3;fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.a-hit{stroke:transparent;stroke-width:18;fill:none;vector-effect:non-scaling-stroke;cursor:pointer}
.a-poly{fill:#11202A;stroke:#22384A;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.a-poly:hover{fill:#152835}
.a-line{stroke-width:var(--w,3)}
.a-line.cat9{stroke:var(--cat9)}
.a-line.alt{stroke:var(--fg-3);stroke-dasharray:5 6;opacity:.75}
.a-line.hot,.a-poly.hot{stroke:var(--accent)}
.a-line.hot{stroke-width:calc(var(--w,3) + 2px)}
.a-poly.hot{fill:#14322F;stroke-width:2}
.a-pt{cursor:pointer}
.a-pt rect,.a-pt circle.core{fill:var(--bg);stroke:var(--route);stroke-width:2}
.a-pt.hot rect,.a-pt.hot circle.core{stroke:var(--accent);fill:#0E2422}
.a-lab{font-family:var(--f-mono);font-size:10px;fill:var(--fg-3);pointer-events:none}
.a-lab.hot{fill:var(--accent)}
.mk{cursor:pointer}
.mk .ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.mk.sel .ring{animation-duration:1.2s}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}

/* Detail panel */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.step{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.step i{height:3px;border-radius:2px;background:var(--line-2);transition:background .3s}
.step.on{color:var(--accent)}
.step.on i{background:var(--accent)}
.det{padding:16px;display:flex;flex-direction:column;gap:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.sev-critical{color:var(--crit)} .sev-high{color:var(--high)} .sev-medium{color:var(--med)} .sev-done{color:var(--ok)}
.det h2{margin:6px 0 0;font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.25;text-wrap:balance}
.meta{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);display:flex;gap:10px;flex-wrap:wrap}
.blk{display:flex;flex-direction:column;gap:8px;transition:opacity .35s}
.blk.wait{opacity:.28}
.blk-h{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.blk-h b{color:var(--accent);font-weight:500}
.blk p{margin:0;color:var(--fg-2)}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0;font-size:13px}
.rows dt{color:var(--fg-3)}
.rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cost{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cost div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cost div:first-child{border-top:0}
.cost .tot{background:var(--raise);font-weight:600}
.cost .tot span:last-child{color:var(--high);font-family:var(--f-display);font-size:17px}
.sapchip{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--fg-2);padding:2px 8px;border-radius:6px;background:var(--raise);border:1px solid var(--line-2);width:fit-content}
.act{border:1px solid var(--accent-dim);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#0A1A1C}
.act p{color:var(--fg)}
.go{min-height:44px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0 16px}
.go:disabled{opacity:.35;cursor:not-allowed}
.doneb{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:8px;background:rgba(94,234,212,.08);border:1px solid var(--accent-dim)}
.doneb b{color:var(--accent);font-family:var(--f-mono);font-weight:500}
.hint{padding:24px 16px;color:var(--fg-3)}
.sh-land{fill:#121E2A;stroke:#284057;stroke-width:1;vector-effect:non-scaling-stroke}
.src{margin:0;font-size:12px;color:var(--fg-3)}
.hud-bl i{border:0}

@media (max-width:1100px){
  .main{grid-template-columns:260px minmax(0,1fr)}
  .detail{grid-column:1 / -1;max-height:none}
}
@media (max-width:760px){
  html,body{height:auto}
  .app{height:auto}
  .main{display:flex;flex-direction:column}
  .mapwrap{height:420px;order:1}
  .detail{order:2}
  .feed{order:3;max-height:420px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .hud-bl{display:none}
}
@media (prefers-reduced-motion:reduce){
  .mk .ring{animation:none;opacity:.5}
  .item.new{animation:none}
  *{transition:none!important}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="12" stroke="#5EEAD4" stroke-width="1.5"/><circle cx="14" cy="14" r="3.5" fill="#5EEAD4"/><path d="M14 2v6M14 20v6M2 14h6M20 14h6" stroke="#5EEAD4" stroke-width="1.5"/></svg>
      <b>Meridian</b><span>Command Centre</span>
    </div>
    <div class="seg" role="group" aria-label="Deployment">
      <button id="s-overview" data-s="overview" aria-pressed="true">Malaysia</button>
      <button id="s-fibre" data-s="fibre" aria-pressed="false">Telecommunications</button>
      <button id="s-energy" data-s="energy" aria-pressed="false">Energy</button>
      <button id="s-estate" data-s="estate" aria-pressed="false">Agriculture</button>
      <button id="s-shipping" data-s="shipping" aria-pressed="false">Sustainability</button>
    </div>
    <div class="ctl">
      <button class="btn" id="live" aria-pressed="true"><span class="dot"></span><span id="liveTxt">Live</span></button>
      <button class="btn" id="reset">Reset demo</button>
      <span class="clock" id="clock">--:-- MYT</span>
    </div>
  </header>

  <section class="kpis" aria-label="Summary">
    <div class="kpi"><div class="l">Open events</div><div class="v" id="k1">0</div><div class="s" id="k1s">&nbsp;</div></div>
    <div class="kpi"><div class="l">Cost at risk</div><div class="v warn" id="k2">RM 0</div><div class="s">Linked to SAP assets</div></div>
    <div class="kpi"><div class="l">Actions raised</div><div class="v" id="k3">0</div><div class="s" id="k3s">SAP documents created</div></div>
    <div class="kpi"><div class="l" id="k4l">Metric</div><div class="v" id="k4">0</div><div class="s" id="k4s">&nbsp;</div></div>
  </section>

  <div class="main">
    <aside class="pane feed" aria-label="Events and actions">
      <div class="pane-h">
        <div class="tabs" role="tablist">
          <button role="tab" id="t-events" aria-selected="true" aria-controls="feedList">Events<span class="count" id="c-ev">0</span></button>
          <button role="tab" id="t-actions" aria-selected="false" aria-controls="feedList">Actions<span class="count" id="c-ac">0</span></button>
          <button role="tab" id="t-routes" aria-selected="false" aria-controls="feedList" hidden>Routes<span class="count">10</span></button>
        </div>
      </div>
      <div class="pane-b"><ul class="list" id="feedList" role="tabpanel"></ul></div>
    </aside>

    <section class="mapwrap" aria-label="Operations map">
      <svg id="map" role="img" aria-label="Map of assets and live events"></svg>
      <div class="hud hud-tl"><button class="back" id="back" hidden>‹ Malaysia</button><b id="place">Malaysia · national view</b><span id="geoNote">Illustrative geography · mock data</span></div>
      <div class="hud hud-bl" id="legend"><span><i style="background:var(--crit)"></i>Critical</span><span><i style="background:var(--high)"></i>High</span><span><i style="background:var(--med)"></i>Medium</span><span><i style="background:var(--route)"></i>Asset</span></div>
      <div class="hud hud-br">
        <button class="zb" id="zin" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="#E6EDF3" stroke-width="1.6"/></svg></button>
        <button class="zb" id="zout" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="#E6EDF3" stroke-width="1.6"/></svg></button>
        <button class="zb" id="zfit" aria-label="Fit to area"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="#E6EDF3" stroke-width="1.6"/></svg></button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>

    <aside class="pane detail" aria-label="Event detail">
      <div class="steps" aria-label="Loop progress">
        <div class="step" id="st1"><i></i>Sense</div>
        <div class="step" id="st2"><i></i>Locate</div>
        <div class="step" id="st3"><i></i>Cost</div>
        <div class="step" id="st4"><i></i>Act</div>
      </div>
      <div class="pane-b" id="detail"></div>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SEV={critical:'var(--crit)',high:'var(--high)',medium:'var(--med)'};
const SEVHEX={critical:'#FF6B6B',high:'#F5A524',medium:'#7DB8FF'};
const SEVRANK={critical:0,high:1,medium:2};

/* ---------- Mock data ---------- */
function fib(id,name,pts,cust,km,zone){
  const n=id.replace('-','');
  return {id,type:'line',pts,name,metric:cust,rows:[
    ['Functional location','MY-KLS-'+n],['Equipment','EQ-'+n+'-01'],['Owner','Ops Zone '+zone],
    ['Cost centre','CC-NW-'+zone+'10'],['Customers served',cust.toLocaleString('en-MY')],['Route length',km+' km'],['Last PM order','4100'+(600+zone*31)+' · closed']]};
}
function pt(id,name,p,rows,shape){return {id,type:'point',p,name,shape:shape||'sq',rows};}

const fibreAssets=[
  fib('F-2201','Exchange – Brickfields',[[480,320],[410,302],[330,290]],2140,2.6,1),
  fib('F-2202','Brickfields – Bangsar South',[[330,290],[250,262],[170,250]],3810,3.1,1),
  fib('F-2203','Bangsar South – Pantai',[[170,250],[95,224],[30,210]],1260,2.2,1),
  fib('F-2211','Exchange – Pudu',[[480,320],[540,252],[600,200]],2980,2.0,2),
  fib('F-2212','Pudu – Bukit Bintang',[[600,200],[690,168],[780,120]],4420,2.7,2),

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ps.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  return [x0,y0,x1,y1];
}
const assetEls={}, screenEls=[];
function buildWorld(){
  gBg.textContent='';gAssets.textContent='';gScreen.textContent='';
  for(const k in assetEls)delete assetEls[k];screenEls.length=0;
  const s=SCN[state.scn];
  const defs=mk('defs',{},gBg);
  if(s.bg.ocean)mk('rect',{x:-4000,y:-4000,width:10000,height:10000,class:'bg-sea'},gBg);
  const pat=mk('pattern',{id:'grid',width:40,height:40,patternUnits:'userSpaceOnUse'},defs);
  mk('path',{d:'M40 0H0V40',fill:'none',stroke:'#111C28','stroke-width':1},pat);
  mk('rect',{x:-2000,y:-2000,width:5000,height:5000,fill:'url(#grid)'},gBg);
  (s.bg.land||[]).forEach(r=>mk('polygon',{points:ptsStr(r),class:'sh-land'},gBg));
  if(s.bg.sea){mk('path',{d:s.bg.sea,class:'bg-sea'},gBg);mk('path',{d:s.bg.coast,class:'bg-coast'},gBg);}
  (s.bg.rivers||[]).forEach(d=>mk('path',{d,class:'bg-river'},gBg));
  (s.bg.roads||[]).forEach(d=>mk('path',{d,class:'bg-road'},gBg));
  if(s.bg.bound)mk('path',{d:s.bg.bound,class:'bg-bound'},gBg);
  s.bg.labels.forEach(([x,y,t])=>{const g=screenG(x,y);mk('text',{class:'bg-label','text-anchor':'start'},g).textContent=t;});

  s.assets.filter(a=>a.type==='poly').forEach(a=>{
    const e=mk('polygon',{points:ptsStr(a.pts),class:'a-poly'},gAssets);
    e.addEventListener('click',()=>pickAsset(a.id));
    const c=centre(a);const g=screenG(c[0],c[1]);const t=mk('text',{class:'a-lab','text-anchor':'middle',y:4},g);t.textContent=a.id;
    assetEls[a.id]={shape:e,lab:t};
  });
  s.assets.filter(a=>a.type==='line').forEach(a=>{
    const e=mk('polyline',{points:ptsStr(a.pts),class:'a-line'+(a.cls?' '+a.cls:'')},gAssets);
    if(a.sw)e.style.setProperty('--w',a.sw);
    const hit=mk('polyline',{points:ptsStr(a.pts),class:'a-hit'},gAssets);
    hit.addEventListener('click',()=>pickAsset(a.id));
    const c=centre(a);const g=screenG(c[0],c[1]);const t=mk('text',{class:'a-lab',x:8,y:-8},g);t.textContent=a.nolab?'':a.id;
    assetEls[a.id]={shape:e,lab:t};
  });
  s.assets.filter(a=>a.type==='point').forEach(a=>{
    const g=screenG(a.p[0],a.p[1]);g.setAttribute('class','a-pt');
    if(a.shape==='hex')mk('rect',{x:-7,y:-7,width:14,height:14,rx:2,transform:'rotate(45)'},g);
    else if(a.shape==='circ')mk('circle',{r:6,class:'core'},g);
    else mk('rect',{x:-5,y:-5,width:10,height:10,rx:1.5},g);
    mk('circle',{r:16,fill:'transparent'},g);
    const t=mk('text',{class:'a-lab',x:12,y:4},g);t.textContent=a.label||a.id;
    g.addEventListener('click',()=>pickAsset(a.id));
    assetEls[a.id]={shape:g,lab:t,pt:true};
  });
  gMarkers=mk('g',{},gScreen);
}
let gMarkers;
function screenG(x,y){const g=mk('g',{},gScreen);g._x=x;g._y=y;screenEls.push(g);return g;}
function toScreen(x,y){return[(x-cam.x)*cam.s+W/2,(y-cam.y)*cam.s+H/2];}
function apply(){
  gWorld.setAttribute('transform',`translate(${W/2} ${H/2}) scale(${cam.s}) translate(${-cam.x} ${-cam.y})`);
  screenEls.forEach(g=>{const p=toScreen(g._x,g._y);g.setAttribute('transform',`translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})`);});
  if(state.mode==='overview')leaders.forEach(l=>{const a=toScreen(l.from[0],l.from[1]),b=toScreen(LBL[0],LBL[1]);
    l.line.setAttribute('x1',a[0]);l.line.setAttribute('y1',a[1]);l.line.setAttribute('x2',b[0]);l.line.setAttribute('y2',b[1]+l.dy);});
}
function resize(){
  const r=svg.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const E=ext();fitS=Math.min(W/E.w,H/E.h);apply();
}
function ext(){return state.mode==='overview'?OV_EXT:SC_EXT;}
function fit(anim){const E=ext();return fly(E.cx,E.cy,fitS,anim);}
let flyTok=0;
function fly(x,y,s,anim=true,d=850){
  const tok=++flyTok;
  if(!anim||reduce){cam.x=x;cam.y=y;cam.s=s;apply();return Promise.resolve();}
  const a={...cam},t0=performance.now();
  return new Promise(res=>{
    function f(t){if(tok!==flyTok)return res();let k=Math.min(1,(t-t0)/d);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      cam.x=a.x+(x-a.x)*k;cam.y=a.y+(y-a.y)*k;cam.s=a.s*Math.pow(s/a.s,k);apply();
      if(k<1)requestAnimationFrame(f);else res();}
    requestAnimationFrame(f);
  });
}
function flyToAsset(a){
  const b=bbox(a),bw=Math.max(80,b[2]-b[0]),bh=Math.max(80,b[3]-b[1]);
  const s=Math.max(fitS*(SCN[state.scn].zoomMin||1.5),Math.min(fitS*3.2,Math.min(W/(bw+220),H/(bh+220))));
  return fly((b[0]+b[2])/2,(b[1]+b[3])/2,s);
}
/* Pan + zoom */
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.mk,.a-pt,.a-hit,.a-poly'))return;drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('drag');flyTok++;});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s;apply();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
svg.addEventListener('wheel',e=>{e.preventDefault();flyTok++;const r=svg.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const wx=(mx-W/2)/cam.s+cam.x,wy=(my-H/2)/cam.s+cam.y;const ns=Math.max(fitS*.6,Math.min(fitS*8,cam.s*Math.exp(-e.deltaY*.0015)));
  cam.s=ns;cam.x=wx-(mx-W/2)/ns;cam.y=wy-(my-H/2)/ns;apply();},{passive:false});
document.getElementById('zin').onclick=()=>fly(cam.x,cam.y,Math.min(fitS*8,cam.s*1.5));
document.getElementById('zout').onclick=()=>fly(cam.x,cam.y,Math.max(fitS*.6,cam.s/1.5));
document.getElementById('zfit').onclick=()=>fit(true);

  mk('path',{d:'M'+K+' 0H0V'+K,fill:'none',stroke:'#10202E','stroke-width':1},pat);
  mk('rect',{x:-3000,y:-3000,width:8000,height:8000,fill:'url(#ogrid)'},gBg);

  OV_LABELS.forEach(([lo,la,t,c])=>{const p=P(lo,la);const g=screenG(p[0],p[1]);mk('text',{class:c,'text-anchor':'middle'},g).textContent=t;});

function scnStats(k){
  const it=per(k).items,open=it.filter(i=>i.status==='open');
  const worst=open.slice().sort((a,b)=>SEVRANK[a.ev.sev]-SEVRANK[b.ev.sev])[0];
  return {open:open.length,done:it.length-open.length,cost:open.reduce((a,i)=>a+total(i.ev),0),sev:worst?worst.ev.sev:null};
}
const leaders=[];
const LBL=P(105.1,4.35), LBL_DY={energy:-108,estate:-52,fibre:4,shipping:60};
function renderHotspots(){
  leaders.length=0;
  ORDER.forEach(k=>{
    const s=SCN[k],st=scnStats(k),p=P(s.hot[0],s.hot[1]),col=st.sev?SEVHEX[st.sev]:'#5EEAD4';
    const go=()=>drill(k);
    const line=mk('line',{stroke:'#3A5670','stroke-width':1,'stroke-dasharray':'3 3'},gMarkers);
    const g=mk('g',{class:'mk','aria-hidden':'true'},gMarkers);
    g._x=p[0];g._y=p[1];screenEls.push(g);
    if(st.open)mk('circle',{r:11,class:'ring',stroke:col},g);
    mk('circle',{r:5+Math.min(st.open,5)*1.1,fill:col,stroke:'#070B10','stroke-width':2},g);
    g.addEventListener('click',go);
    const t1=s.name, t2=st.open?st.open+' open · '+rmc(st.cost):'All clear';
    const wdt=Math.max(t1.length*8.2,t2.length*7)+22, hgt=44, dy=LBL_DY[k];
    const bg=mk('g',{class:'mk',tabindex:0,role:'button','aria-label':'Zoom in to '+s.name+', '+t2},gMarkers);
    bg._x=LBL[0];bg._y=LBL[1];screenEls.push(bg);
    const inner=mk('g',{transform:'translate(0 '+dy+')'},bg);
    mk('rect',{x:0,y:0,width:wdt,height:hgt,rx:8,class:'hs-bg'},inner);
    mk('circle',{cx:12,cy:15,r:4,fill:col},inner);
    mk('text',{x:22,y:19,class:'hs-t'},inner).textContent=t1;
    mk('text',{x:12,y:36,class:'hs-s'},inner).textContent=t2;
    bg.addEventListener('click',go);
    bg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    leaders.push({line,from:p,dy:dy+hgt/2});
  });
}

/* ---------- Markers ---------- */
function renderMarkers(){
  if(!gMarkers)return;
  screenEls.splice(0,screenEls.length,...screenEls.filter(g=>g.parentNode!==gMarkers));
  gMarkers.textContent='';
  if(state.mode==='overview'){renderHotspots();apply();return;}
  const items=per().items.filter(i=>i.status==='open').sort((a,b)=>SEVRANK[b.ev.sev]-SEVRANK[a.ev.sev]);
  items.forEach(it=>{
    const a=assetById(it.ev.asset),c=centre(a),col=SEVHEX[it.ev.sev];
    const g=mk('g',{class:'mk'+(state.sel===it.ev.id?' sel':''),tabindex:0,role:'button','aria-label':it.ev.title},gMarkers);
    g._x=c[0];g._y=c[1];screenEls.push(g);
    mk('circle',{r:10,class:'ring',stroke:col},g);
    mk('circle',{r:state.sel===it.ev.id?8:6,fill:col,stroke:'#070B10','stroke-width':2},g);
    g.addEventListener('click',()=>select(it.ev.id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(it.ev.id);}});
  });
  apply();
}
function highlight(id){
  for(const k in assetEls){const o=assetEls[k];const on=k===id;
    if(o.pt)o.shape.classList.toggle('hot',on);else o.shape.classList.toggle('hot',on);
    o.lab.classList.toggle('hot',on);}
}

    const all=ORDER.flatMap(k=>per(k).items),open=all.filter(i=>i.status==='open'),done=all.filter(i=>i.status==='done');

  }
  const p=per(),s=SCN[state.scn],open=p.items.filter(i=>i.status==='open'),done=p.items.filter(i=>i.status==='done');

const feedEl=document.getElementById('feedList');
function renderFeed(){
  feedEl.textContent='';
  if(state.tab==='routes'){
    LANES.slice().sort((a,b)=>b.e-a.e).forEach(L=>{
      const li=document.createElement('li');const b=document.createElement('button');b.className='item';
      b.style.setProperty('--sevc',L.cat===4?'var(--accent)':'var(--cat9)');
      if(state.sel==='a:'+L.id)b.setAttribute('aria-current','true');
      const t=h('span','t',pn(L.from)+' → '+pn(L.to));
      const m=h('span','m','Cat '+L.cat+' · '+L.inc+' · '+fmt(L.km)+' km · '+fmt(L.t)+' t');
      const c=h('span','c',fmt(L.e)+' tCO₂e');
      b.append(t,c,m);b.onclick=()=>pickAsset(L.id,true);li.appendChild(b);feedEl.appendChild(li);});
    return;
  }
  const ov=state.mode==='overview';
  const pool=ov?ORDER.flatMap(k=>per(k).items.map(i=>(i._k=k,i))):per().items.map(i=>(i._k=state.scn,i));
  let list=state.tab==='events'?pool.filter(i=>i.status==='open'):pool.filter(i=>i.status==='done');
  list=list.slice().sort((a,b)=>state.tab==='events'?(SEVRANK[a.ev.sev]-SEVRANK[b.ev.sev])||(b.at-a.at):b.doneAt-a.doneAt);
  if(!list.length){const li=document.createElement('li');li.className='empty';
    li.textContent=state.tab==='events'?'No open events. New signals appear here as they arrive.':'No actions yet. Create one from an event to see the SAP document here.';
    feedEl.appendChild(li);return;}
  list.forEach(it=>{
    const li=document.createElement('li');const b=document.createElement('button');
    b.className='item'+(it.status==='done'?' done':'')+(it.fresh?' new':'');it.fresh=false;
    b.style.setProperty('--sevc',it.status==='done'?'var(--ok)':SEV[it.ev.sev]);
    if(state.sel===it.ev.id)b.setAttribute('aria-current','true');
    const t=document.createElement('span');t.className='t';t.textContent=it.ev.title;
    const m=document.createElement('span');m.className='m';
    const tag=ov?SCN[it._k].short+' · ':'';
    m.textContent=tag+(it.status==='done'?it.docNo+' · '+it.ev.asset:it.ev.asset+' · '+it.ev.source+' · '+ago(it.at));
    const c=document.createElement('span');c.className='c';c.textContent=rmc(total(it.ev));
    b.append(t,c,m);const k=it._k;b.onclick=()=>ov?drill(k,it.ev.id):select(it.ev.id);
    li.appendChild(b);feedEl.appendChild(li);
  });
}

/* ---------- Detail / loop ---------- */
const det=document.getElementById('detail');
let stage=0,stageTok=0;
function setStage(n){stage=n;for(let i=1;i<=4;i++)document.getElementById('st'+i).classList.toggle('on',i<=n);
  det.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('wait',+b.dataset.stage>n));
  const go=det.querySelector('.go');if(go)go.disabled=n<4;}
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function rowsEl(rows){const dl=h('dl','rows');rows.forEach(([k,v])=>{dl.append(h('dt',null,k),h('dd',null,v));});return dl;}
function blk(n,label,extra){const b=h('div','blk');b.dataset.stage=n;const hh=h('div','blk-h');hh.append(h('b',null,'0'+n),document.createTextNode(label));if(extra)hh.append(extra);b.append(hh);return b;}

function select(id){
  const it=per().items.find(i=>i.ev.id===id);if(!it)return;
  state.sel=id;const a=assetById(it.ev.asset);
  highlight(a.id);renderMarkers();renderFeed();renderDetail(it);
  const tok=++stageTok;
  if(it.status==='done'||reduce){setStage(4);flyToAsset(a);return;}
  setStage(1);
  setTimeout(()=>{if(tok!==stageTok)return;flyToAsset(a).then(()=>{if(tok!==stageTok)return;setStage(2);
    setTimeout(()=>{if(tok===stageTok)setStage(3);},500);
    setTimeout(()=>{if(tok===stageTok)setStage(4);},1000);});},350);
}
function calcEl(a){const ct=h('div','cost');a.calc.forEach(([k,v])=>{const r=h('div');r.append(h('span',null,k),h('span',null,v));ct.append(r);});
  const tr=h('div','tot');tr.append(h('span',null,'Emissions (tank-to-wake)'),h('span',null,fmt(a.lane.e)+' tCO₂e/yr'));ct.append(tr);return ct;}
function srcNote(){return h('p','src','Factors: UK DESNZ GHG conversion factors 2025, freighting goods. Distance: sum of great-circle legs between lane waypoints. Volumes are illustrative.');}
function pickAsset(id,force){
  const it=force?null:per().items.find(i=>i.ev.asset===id&&i.status==='open');
  if(it)return select(it.ev.id);
  state.sel='a:'+id;++stageTok;const a=assetById(id);highlight(id);renderMarkers();renderFeed();
  det.textContent='';const d=h('div','det');
  const top=h('div');top.append(h('span','pill sev-done','Monitored'));top.append(h('h2',null,a.name));
  const openN=per().items.filter(i=>i.ev.asset===id&&i.status==='open').length;
  const m=h('div','meta');m.append(h('span',null,a.id),h('span',null,openN?openN+' open event':'No open events'));top.append(m);
  const b=blk(2,a.lane?'Lane in SAP':'Asset in SAP');b.append(rowsEl(a.rows));
  const hist=per().items.filter(i=>i.ev.asset===id&&i.status==='done');
  d.append(top,b);

  if(hist.length){const hb=blk(4,'Actions on this asset');hist.forEach(i=>hb.append(h('p',null,i.docNo+' · '+i.ev.title)));d.append(hb);}
  det.append(d);setStage(a.calc?3:2);flyToAsset(a);

function renderDetail(it){
  const ev=it.ev,a=assetById(ev.asset);det.textContent='';
  const d=h('div','det');
  const top=h('div');
  top.append(h('span','pill '+(it.status==='done'?'sev-done':'sev-'+ev.sev),it.status==='done'?'Actioned':ev.sev));
  top.append(h('h2',null,ev.title));
  const m=h('div','meta');m.append(h('span',null,ev.id),h('span',null,it.status==='done'?'Closed loop':'Detected '+ago(it.at)));top.append(m);

  const b1=blk(1,'Sense');b1.append(h('span','sapchip',ev.source));b1.append(h('p',null,ev.detail));
  const b2=blk(2,'Locate');b2.append(h('p',null,a.name+' ('+a.id+')'));b2.append(rowsEl(a.rows));
  if(a.calc){b2.append(calcEl(a),srcNote());}
  const b3=blk(3,'Cost');const ct=h('div','cost');

  const tr=h('div','tot');tr.append(h('span',null,'Value at risk'),h('span',null,rm(total(ev))));ct.append(tr);b3.append(ct);
  if(state.scn==='energy'&&ev.metric){b3.append(h('span','sapchip','Emissions · '+ev.metric+' tCO₂e per day · Scope 1'));}
  if(state.scn==='shipping'&&ev.metric){b3.append(h('span','sapchip','Emissions impact · '+fmt(ev.metric)+' tCO₂e · Scope 3 Cat '+a.lane.cat));}

  const b4=blk(4,'Act');const box=h('div','act');box.append(h('p',null,ev.action));
  box.append(h('span','sapchip','SAP · '+ev.doc));

    const dn=h('div','doneb');dn.append(h('b',null,it.docNo+' created'));dn.append(h('span',null,'Assigned to '+(rowVal(a,'Owner')||rowVal(a,'Cost centre')||'asset owner')+' · '+ago(it.doneAt)));box.append(dn);
  }else{
    const go=h('button','go',ev.btn);go.disabled=true;go.onclick=()=>act(it);box.append(go);

function rowVal(a,k){const r=a.rows.find(r=>r[0]===k);return r&&r[1];}
function act(it){
  const k=it.ev.kind;const n=++docSeq[k];
  const pre={order:'PM order ',notif:'Notification ',plan:'Plan change ',esg:'Footprint entry '}[k];
  it.status='done';it.docNo=pre+n;it.doneAt=Date.now();
  toast('Created '+it.docNo+' for '+it.ev.asset);
  renderKPIs();renderMarkers();renderFeed();renderDetail(it);setStage(4);
  const next=per().items.filter(i=>i.status==='open').sort((a,b)=>SEVRANK[a.ev.sev]-SEVRANK[b.ev.sev])[0];
  if(next)setTimeout(()=>{if(state.sel===it.ev.id)select(next.ev.id);},2200);
}

/* ---------- Toast, live feed, clock ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg,sev){toastEl.textContent='';if(sev){const d=h('span');d.style.cssText='width:8px;height:8px;border-radius:50%;background:'+SEV[sev];toastEl.append(d);}
  toastEl.append(document.createTextNode(msg));toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),3200);}
let rr=0;
function tick(){
  if(!state.live)return;
  let k=state.scn;
  if(state.mode==='overview'){const ks=ORDER;k=null;for(let n=0;n<ks.length;n++){const c=ks[(rr+n)%ks.length];if(per(c).qi<SCN[c].events.length){k=c;rr=(rr+n+1)%ks.length;break;}}if(!k)return;}
  const p=per(k),s=SCN[k];
  if(p.qi>=s.events.length)return;
  const ev=s.events[p.qi++];p.items.push({ev,at:Date.now(),status:'open',fresh:true});
  toast((state.mode==='overview'?s.short+' · ':'New event · ')+ev.title,ev.sev);
  renderKPIs();renderMarkers();if(state.tab==='events')renderFeed();
}
setInterval(tick,9000);
setInterval(()=>{if(state.tab==='events')renderFeed();},30000);
const clk=document.getElementById('clock');
function clock(){try{clk.textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'}).format(new Date())+' MYT';}catch(e){clk.textContent='';}}
clock();setInterval(clock,20000);

const liveBtn=document.getElementById('live');
liveBtn.onclick=()=>{state.live=!state.live;liveBtn.setAttribute('aria-pressed',state.live);document.getElementById('liveTxt').textContent=state.live?'Live':'Paused';};
document.getElementById('reset').onclick=()=>{docSeq={order:41010734,notif:10024418,plan:7700213,esg:5500120};
  if(state.mode==='overview'){state.per={};showOverview(false);}else{delete state.per[state.scn];loadScenario(state.scn);}toast('Demo reset');};

/* ---------- Overview <-> scenario ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;
function setSeg(k){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===k));}
function renderOverviewDetail(){
  det.textContent='';setStage(0);
  const d=h('div','det');const top=h('div');
  top.append(h('span','pill sev-done','National view'));top.append(h('h2',null,'Malaysia operations'));
  top.append(h('p',null,'Four deployments run on one engine. Pick a site on the map or below to zoom in.'));
  top.lastChild.style.cssText='margin:6px 0 0;color:var(--fg-2)';
  const list=h('div','dcards');
  ORDER.forEach(k=>{const s=SCN[k],st=scnStats(k);const b=h('button','dcard');
    b.append(h('b',null,s.name),h('span','go-t','Zoom in ›'),h('span','pl',s.place));
    const n=h('div','nums');n.append(h('span',null,st.open+' open'),h('span',null,rmc(st.cost)+' at risk'),h('span',null,st.done+' actioned'));b.append(n);
    if(st.sev)b.style.boxShadow='inset 3px 0 0 '+SEV[st.sev];
    b.onclick=()=>drill(k);list.append(b);});
  d.append(top,list);det.append(d);
}
function renderAll(){renderKPIs();renderFeed();renderMarkers();if(state.mode==='overview')renderOverviewDetail();}
const LEG0=document.getElementById('legend').innerHTML;
const LEGSHIP='<span><i style="background:var(--accent)"></i>Cat 4 · we pay freight</span><span><i style="background:var(--cat9)"></i>Cat 9 · customer pays</span><span><i style="background:transparent;border:1px dashed var(--fg-3)"></i>Alternative route</span><span><i style="background:var(--high)"></i>Event</span>';
function setScnChrome(k){
  const ship=k==='shipping';document.getElementById('t-routes').hidden=!ship;
  if(!ship&&state.tab==='routes')setTab('events');
  document.getElementById('legend').innerHTML=ship?LEGSHIP:LEG0;
  document.getElementById('geoNote').textContent=k==='overview'?'Natural Earth boundaries · mock data':ship?'Natural Earth coastlines · illustrative volumes':'Illustrative geography · mock data';
}
async function showOverview(anim){
  const from=state.mode==='scenario'?state.scn:null;
  state.mode='overview';state.sel=null;++stageTok;setSeg('overview');setScnChrome('overview');
  document.getElementById('back').hidden=true;
  document.getElementById('place').textContent='Malaysia · national view';
  buildOverview();resize();
  if(anim&&from&&!reduce){const p=P(...SCN[from].hot);cam.x=p[0];cam.y=p[1];cam.s=fitS*7;apply();}
  else fit(false);
  renderAll();
  svg.style.opacity=1;
  if(anim&&from&&!reduce)await fit(true);
}
async function goOverview(){
  if(busy||state.mode==='overview')return;busy=true;
  if(!reduce){svg.style.opacity=0;await wait(200);}
  await showOverview(true);busy=false;
}
async function drill(k,evId){
  if(busy)return;busy=true;
  if(state.mode==='overview'&&!reduce){
    const p=P(...SCN[k].hot);await fly(p[0],p[1],fitS*10,true,1000);
    svg.style.opacity=0;await wait(200);
  }else if(state.mode==='scenario'&&!reduce){svg.style.opacity=0;await wait(200);}
  loadScenario(k,{intro:true,sel:evId});busy=false;
}
function loadScenario(k,o){
  o=o||{};
  state.mode='scenario';state.scn=k;state.sel=null;++stageTok;setSeg(k);
  setScnChrome(k);
  document.getElementById('back').hidden=false;
  document.getElementById('place').textContent=SCN[k].place;
  buildWorld();resize();
  if(o.intro&&!reduce){cam.x=SC_EXT.cx;cam.y=SC_EXT.cy;cam.s=fitS*.3;apply();svg.style.opacity=1;fit(true);}
  else{fit(false);svg.style.opacity=1;}
  renderKPIs();renderFeed();renderMarkers();
  const first=o.sel?per().items.find(i=>i.ev.id===o.sel):per().items.filter(i=>i.status==='open').sort((a,b)=>SEVRANK[a.ev.sev]-SEVRANK[b.ev.sev])[0];
  if(first)setTimeout(()=>select(first.ev.id),o.intro?950:400);
  else{det.textContent='';det.append(h('p','hint','All events are actioned. Turn on Live to receive new signals, or pick an asset on the map.'));setStage(0);}
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.s;
  if(k==='overview')goOverview();else if(state.mode==='overview'||k!==state.scn)drill(k);});
document.getElementById('back').onclick=goOverview;
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const s=cam.s/fitS;resize();cam.s=fitS*s;apply();},120);});

showOverview(false);
})();
</script>

</html>
